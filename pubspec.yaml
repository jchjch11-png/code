name: hydration_app
description: A multilingual hydration journal with actionable local reminders.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  intl: any
  path: ^1.9.1
  sqflite: ^2.4.6
  uuid: ^4.6.0
  flutter_local_notifications: ^23.0.4
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  generate: true
